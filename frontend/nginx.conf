# nginx.conf — generic config for serving the BillBro React build and
# proxying API calls to Person A's backend.
#
# This is portable/generic since the exact deploy target (local box, VM,
# EC2, etc.) isn't decided yet. Adjust the CAPITALIZED placeholders below
# and drop this into /etc/nginx/sites-available/billbro (symlink into
# sites-enabled), or /etc/nginx/conf.d/billbro.conf on RHEL-style systems.

server {
    listen 80;
    server_name _;   # replace with your domain, or leave "_" to catch all

    # Path to the built React app (output of `npm run build` -> dist/).
    root /var/www/billbro/dist;   # <-- CHANGE ME to wherever you copy dist/
    index index.html;

    # Gzip the usual text-based assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed static assets aggressively; Vite fingerprints filenames
    # so this is safe.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any unknown path falls back to index.html so
    # React Router can handle client-side routes like /inventory, /alerts.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API calls to the backend (Person A's service).
    # Matches the VITE_API_BASE_URL used at build time when it's set to
    # a relative "/api" path — otherwise the frontend can call the
    # backend's own origin directly and this block isn't needed.
    location /api/ {
        proxy_pass http://BACKEND_HOST:BACKEND_PORT/;   # <-- CHANGE ME
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large image uploads (checkout detection, training images).
        client_max_body_size 20m;
    }
}

# ── Optional: HTTPS ──────────────────────────────────────────────────────────
# Once you have a domain + certs (e.g. via certbot), add a second server
# block redirecting :80 -> :443 and serve the above on 443 with:
#   listen 443 ssl;
#   ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
